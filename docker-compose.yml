name: tracepilot

x-database-env: &database-env
  POSTGRES_DB: ${POSTGRES_DB:-tracepilot}
  POSTGRES_USER: ${POSTGRES_USER:-tracepilot}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracepilot_dev}

x-tracing-env: &tracing-env
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces

x-app: &app
  build: .
  image: tracepilot-app:dev
  healthcheck:
    test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready', timeout=5).close()"]
    interval: 10s
    timeout: 6s
    retries: 5
    start_period: 5s
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"

services:
  db:
    image: postgres:17-alpine
    environment: *database-env
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 15

  event-processor:
    <<: *app
    command: ["uvicorn", "services.event_processor.main:app", "--host", "0.0.0.0", "--no-access-log", "--log-level", "warning"]
    environment:
      <<: [*database-env, *tracing-env]
      PGHOST: db
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
    ports:
      - "127.0.0.1:${EVENT_PROCESSOR_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy

  game-server:
    <<: *app
    command: ["uvicorn", "services.game_server.main:app", "--host", "0.0.0.0", "--no-access-log", "--log-level", "warning"]
    environment:
      <<: [*database-env, *tracing-env]
      PGHOST: db
      PROCESSOR_URL: http://event-processor:8000
      PROCESSOR_TIMEOUT_SECONDS: ${PROCESSOR_TIMEOUT_SECONDS:-1.0}
    ports:
      - "127.0.0.1:${GAME_SERVER_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      event-processor:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.16.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "ready", "--url=http://127.0.0.1:9090"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    command: ["--config=/etc/jaeger/jaeger.yml"]
    ports:
      - "127.0.0.1:${JAEGER_PORT:-16686}:16686"
    volumes:
      - ./observability/jaeger.yml:/etc/jaeger/jaeger.yml:ro

volumes:
  pgdata:
  prometheus_data:
